<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: pink;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 42px;
            max-width: 900px;
            margin-bottom: 25px;
            animation: fadeIn 1s ease;
        }
                button{
            background: white;
            padding: 15px 45px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(80, 60, 120, 0.15);
            transition: 0.3s ease;
            border: none;
        }

        button:hover {
            transform: translateY(-8px) rotate(-2deg);
            box-shadow: 0 12px 25px rgba(80, 60, 120, 0.25);
            background-color:#fff3c4;
        }

    </style>
</head>
<body>
    <h1>
        CONGRATULATION ! click button to place your First order
    </h1>
    <button>
        Click Me
    </button>
</body>
</html>
