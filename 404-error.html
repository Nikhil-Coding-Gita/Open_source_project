<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            background: #f8fafc;
            color: #0f172a;
        }

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            position: relative;
            overflow: hidden;
        }

        /* Background */

        .page::before {
            content: "";

            position: absolute;
            width: 600px;
            height: 600px;

            border-radius: 50%;

            background: #e0f2fe;

            top: -300px;
            right: -200px;

            filter: blur(2px);
        }

        .page::after {
            content: "";

            position: absolute;
            width: 500px;
            height: 500px;

            border-radius: 50%;

            background: #ede9fe;

            bottom: -280px;
            left: -200px;

            filter: blur(2px);
        }

        /* Main Card */

        .error-container {
            width: 100%;
            max-width: 900px;

            text-align: center;

            position: relative;
            z-index: 2;
        }

        /* Logo */

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 52px;
            height: 52px;

            margin-bottom: 35px;

            border-radius: 14px;

            background: #0f172a;
            color: #ffffff;

            font-size: 20px;
            font-weight: 800;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.15);
        }

        /* Error Number */

        .error-number {
            font-size: clamp(150px, 25vw, 260px);

            font-weight: 900;

            line-height: 0.8;

            letter-spacing: -15px;

            color: #0f172a;

            position: relative;
        }

        .error-number span {
            color: #2563eb;
        }

        /* Small Label */

        .label {
            display: inline-block;

            margin-top: 35px;
            margin-bottom: 18px;

            padding: 7px 13px;

            border-radius: 50px;

            background: #eff6ff;
            color: #2563eb;

            border: 1px solid #dbeafe;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Heading */

        h1 {
            font-size: clamp(30px, 5vw, 48px);

            line-height: 1.15;

            letter-spacing: -1.5px;

            font-weight: 750;

            color: #0f172a;
        }

        /* Description */

        .description {
            max-width: 580px;

            margin: 18px auto 0;

            color: #64748b;

            font-size: 17px;

            line-height: 1.7;
        }

        /* Buttons */

        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 32px;

            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 150px;

            padding: 13px 20px;

            border-radius: 9px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 650;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button-primary {
            background: #0f172a;

            color: #ffffff;

            box-shadow:
                0 8px 20px rgba(15, 23, 42, 0.15);
        }

        .button-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 28px rgba(15, 23, 42, 0.22);

            background: #1e293b;
        }

        .button-secondary {
            background: #ffffff;

            color: #334155;

            border: 1px solid #e2e8f0;
        }

        .button-secondary:hover {
            transform: translateY(-2px);

            background: #f8fafc;

            border-color: #cbd5e1;
        }

        /* Divider */

        .divider {
            width: 100%;
            max-width: 500px;

            height: 1px;

            margin: 45px auto 25px;

            background: #e2e8f0;
        }

        /* Footer */

        .footer {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 8px;

            color: #94a3b8;

            font-size: 13px;
        }

        .status {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        /* Responsive */

        @media (max-width: 600px) {

            .page {
                padding: 30px 18px;
            }

            .logo {
                margin-bottom: 25px;
            }

            .error-number {
                font-size: 130px;

                letter-spacing: -8px;
            }

            .label {
                margin-top: 30px;
            }

            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;

                width: 100%;
                max-width: 320px;

                margin-left: auto;
                margin-right: auto;
            }

            .button {
                width: 100%;
            }

            .divider {
                margin-top: 35px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="error-container">

            <!-- Project Logo -->
            <div class="logo">
                OS
            </div>

            <!-- Error Number -->
            <div class="error-number">
                4<span>0</span>4
            </div>

            <!-- Error Label -->
            <div class="label">
                Error 404
            </div>

            <!-- Main Heading -->
            <h1>
                Page not found
            </h1>

            <!-- Description -->
            <p class="description">
                The page you're looking for doesn't exist or may have
                been moved. Check the URL or return to the main page
                to continue exploring the project.
            </p>

            <!-- Actions -->
            <div class="actions">

                <a href="/" class="button button-primary">
                    ← Back to Home
                </a>

                <a href="javascript:history.back()" class="button button-secondary">
                    Go Back
                </a>

            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Footer -->
            <div class="footer">

                <span class="status"></span>

                <span>
                    Open Source Project
                </span>

                <span>•</span>

                <span>
                    Everything is running normally
                </span>

            </div>

        </section>

    </main>

</body>
</html>
